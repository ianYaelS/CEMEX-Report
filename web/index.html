<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CEMEX · Samsara</title>
    <link rel="stylesheet" href="./styles.css?v=5" />
  </head>
  <body>
    <div class="signal" aria-hidden="true"></div>
    <main class="shell">
      <header>
        <p class="brand">Samsara</p>
        <h1>CEMEX</h1>
        <p class="lede">Token. Function. Unidad. Fechas. El reporte se genera en Samsara.</p>
      </header>

      <section id="gate" class="card">
        <label for="token">API token</label>
        <input
          id="token"
          type="password"
          autocomplete="off"
          spellcheck="false"
          placeholder="samsara_api_…"
        />
        <button id="unlock" type="button">Continuar</button>
        <p id="gateStatus" class="status" role="status"></p>
      </section>

      <section id="workspace" class="hidden">
        <section class="card">
          <div class="toolbar">
            <p id="fleetMeta" class="hint"></p>
            <button id="lock" type="button" class="ghost">Salir</button>
          </div>

          <label for="function">Function</label>
          <select id="function"></select>

          <label for="filter">Unidad</label>
          <input id="filter" type="search" placeholder="Buscar nombre, placa o id" autocomplete="off" />
          <select id="vehicle"></select>

          <div class="row">
            <div>
              <label for="start">Inicio</label>
              <input id="start" type="date" />
            </div>
            <div>
              <label for="end">Fin</label>
              <input id="end" type="date" />
            </div>
          </div>

          <button id="generate" type="button">Generar reporte</button>
          <p id="status" class="status" role="status"></p>
        </section>

        <section id="result" class="card hidden">
          <p class="eyebrow">Listo en Samsara Storage</p>
          <p id="resultSummary"></p>
          <p id="storagePath" class="path"></p>
          <p id="correlation" class="hint"></p>
          <div class="actions">
            <a id="storageLink" class="button-link" href="#" target="_blank" rel="noopener">Abrir Storage</a>
            <a id="functionLink" class="button-link ghost-link" href="#" target="_blank" rel="noopener">Ver Function</a>
          </div>
        </section>
      </section>
    </main>
    <script src="./app.js?v=5" type="module"></script>
  </body>
</html>
